version: "3"

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    environment:
      - CLUSTER_NAME=khdl_cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      # Ép NameNode giao tiếp và trả về dữ liệu dạng Hostname cho Client bên ngoài
      - HDFS_CONF_dfs_client_use_datanode_hostname=true
      - HDFS_CONF_dfs_datanode_use_datanode_hostname=true
    ports:
      - "9870:9870"
      - "9000:9000"

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    hostname: datanode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      # Ép DataNode đăng ký với NameNode bằng Hostname thay vì IP nội bộ
      - HDFS_CONF_dfs_client_use_datanode_hostname=true
      - HDFS_CONF_dfs_datanode_use_datanode_hostname=true
    ports:
      - "9864:9864"
      - "9866:9866"
    depends_on:
      - namenode